<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn English letters with interactive audio pronunciation">
    <meta name="theme-color" content="#4285f4">
    <title>English Letters - Interactive Audio Learning</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>

<body>
    <header>
        <h1>English Letters</h1>
    </header>
    <main>
        <div id="buttons" aria-label="Letter buttons"></div>
    </main>
    <footer>
        <p>&copy; 2023 English Letters App. All rights reserved.</p>
    </footer>
    <script src="js/app.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => console.log('ServiceWorker registered'))
                .catch(error => console.log('ServiceWorker registration failed:', error));
        }
    </script>
</body>

</html>
